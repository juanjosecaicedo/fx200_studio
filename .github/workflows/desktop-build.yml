name: Desktop builds
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v5
        with:
          name: fx200_studio-windows
          path: build/windows/x64/runner/Release

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: brew install hidapi
      - run: flutter pub get
      - run: flutter test
      - run: flutter build macos --release
      - run: macos/bundle_hidapi.sh build/macos/Build/Products/Release/fx200_studio.app
      - run: ditto -c -k --keepParent build/macos/Build/Products/Release/fx200_studio.app fx200_studio-macos.zip
      - uses: actions/upload-artifact@v5
        with:
          name: fx200_studio-macos
          path: fx200_studio-macos.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libusb-1.0-0
      - run: flutter pub get
      - run: flutter test
      - run: flutter build linux --release
      - run: tar -czf fx200_studio-linux.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v5
        with:
          name: fx200_studio-linux
          path: fx200_studio-linux.tar.gz
